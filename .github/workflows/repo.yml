name: repo
on:
  pull_request:
  push:
    branches: [main]
jobs:
  env-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-env-example.sh
      - run: python3 scripts/check_tokens.py contracts/brand-tokens.json android/core/designsystem/src/main/kotlin/br/malhaviva/core/designsystem/MalhaVivaColors.kt
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@2.83.0 lint contracts/openapi.yaml
      - run: npx --yes @asyncapi/cli@6.3.1 validate contracts/asyncapi.yaml
