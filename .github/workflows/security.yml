name: security
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # segunda-feira, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historico completo: segredo removido depois do commit continua vazado
      # CLI oficial em imagem com versao fixa (a action gitleaks-action tem EULA/licenca propria).
      # --redact: o valor do segredo nunca vai para o log. Achado = exit 1. Se acontecer, ROTACIONE o segredo.
      - name: gitleaks (historico completo)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.186.0
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Falha somente em severidade ERROR; WARNING/INFO aparecem no log sem bloquear.
      - run: >
          semgrep scan
          --config p/ci --config p/kotlin --config p/secrets
          --severity ERROR --error --metrics off

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Escaneia os gradle.lockfile de backend/ e android/ (dependencyLocking; atualizar com --write-locks).
      # Sem lockfile o job falha: gate silencioso nao protege. Vulnerabilidade encontrada = exit 1.
      - name: osv-scanner (lockfiles Gradle)
        run: |
          mapfile -t locks < <(find backend android -type f -name 'gradle.lockfile' -not -path '*/build/*' | sort)
          if [ "${#locks[@]}" -eq 0 ]; then
            echo "::error title=osv-scanner::Nenhum gradle.lockfile em backend/ ou android/."
            exit 1
          fi
          args=()
          for f in "${locks[@]}"; do args+=(-L "/src/$f"); done
          docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.7.1 \
            scan source "${args[@]}"

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: CRITICAL,HIGH
          exit-code: '1'

  # DAST. Ainda NAO existe ambiente de staging: este job so roda manualmente (workflow_dispatch) e
  # so se a variavel de repositorio STAGING_URL estiver definida; sem ela, e pulado sem falhar.
  # Nunca apontar para producao.
  zap-baseline:
    if: github.event_name == 'workflow_dispatch' && vars.STAGING_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.STAGING_URL }}
          allow_issue_writing: false
          fail_action: true
