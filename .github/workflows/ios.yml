name: ios
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**']
jobs:
  check:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen swiftlint swiftformat
      - run: swiftlint --strict
      - run: swiftformat --lint .
      - run: swift test --package-path Packages/MalhaVivaKit
      - run: xcodegen generate
      - run: xcodebuild build -project MalhaViva.xcodeproj -scheme MalhaViva -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
